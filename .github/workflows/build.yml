name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Create dummy icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          
          # Create a simple 32x32 PNG (red square)
          $bytes = [System.Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAAA7AAAAOwBeShxvQAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAAABNSURBVFiF7dYxDQAgEMCwA/+/M3YgJKRJdXV3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3dwHvGQYBXKKpVQAAAABJRU5ErkJggg==")
          [System.IO.File]::WriteAllBytes("src-tauri/icons/32x32.png", $bytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/128x128.png", $bytes)
          [System.IO.File]::WriteAllBytes("src-tauri/icons/128x128@2x.png", $bytes)
          
          # Create ICO file (Windows)
          Copy-Item "src-tauri/icons/32x32.png" "src-tauri/icons/icon.ico"
          
          # Create ICNS file (macOS) - just copy PNG
          Copy-Item "src-tauri/icons/32x32.png" "src-tauri/icons/icon.icns"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/yl-marketing-control-center.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/yl-marketing-control-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
