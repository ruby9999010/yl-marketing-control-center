name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Install ImageMagick
        run: choco install imagemagick -y

      - name: Create app icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          
          # Create a simple SVG icon
          $svg = @"
          <svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
            <rect width="256" height="256" fill="#0A84FF"/>
            <text x="128" y="140" font-family="Arial" font-size="120" fill="white" text-anchor="middle" font-weight="bold">YL</text>
          </svg>
          "@
          $svg | Out-File -FilePath "src-tauri/icons/icon.svg" -Encoding UTF8
          
          # Convert SVG to PNG using ImageMagick
          magick convert -background none -size 32x32 src-tauri/icons/icon.svg src-tauri/icons/32x32.png
          magick convert -background none -size 128x128 src-tauri/icons/icon.svg src-tauri/icons/128x128.png
          magick convert -background none -size 256x256 src-tauri/icons/icon.svg src-tauri/icons/128x128@2x.png
          magick convert -background none -size 256x256 src-tauri/icons/icon.svg src-tauri/icons/icon.png
          
          # Create ICO file (Windows)
          magick convert src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
          
          # Create ICNS file (macOS) - just use PNG for now
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/icon.icns"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/yl-marketing-control-center.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/yl-marketing-control-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
